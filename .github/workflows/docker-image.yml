name: Build and push docker image

on:
  push:
    branches: [ dev ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ dev ]

jobs:
  docker:
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context    : .
          file       : ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Trigger external deploy pipeline
        if: success() && github.ref == 'refs/heads/dev' && matrix.os == 'ubuntu-latest'
        run: |
            if [ -z "${{ secrets.DEPLOY_PIPELINE_URL }}" ]; then
              echo "Error: DEPLOY_PIPELINE_URL is not set"
            else
              curl -X POST "${{ secrets.DEPLOY_PIPELINE_URL }}"
            fi
